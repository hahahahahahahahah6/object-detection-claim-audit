[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for box finding"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
object-detection-claim-audit = "object_detection_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["object_detection_claim_audit*"]
